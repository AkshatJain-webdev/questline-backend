[project]
name = "questline-backend"
version = "0.1.0"
description = "Questline backend — FastAPI + MongoDB API and services for a skill-tree goal tracker."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pymongo==4.19.0",
    "pydantic==2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
